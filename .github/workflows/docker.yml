name: docker

# Builds the amd64 image on a version tag and pushes it to ghcr.io/samwiseg0/arr-media-guard as the version, v1.6.0 as
# 1.6.0. Only a plain vX.Y.Z tag moves latest, so a pre-release such as v1.6.0-rc1 never does. The job runs only when the repository variable PUBLISH_IMAGE is true. The owner sets it at
# release time. Until then a tag push skips the job. A manual run on a tag publishes that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: vars.PUBLISH_IMAGE == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read the version from the tag
        id: version
        run: |
          tags="ghcr.io/samwiseg0/arr-media-guard:${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then tags="$tags,ghcr.io/samwiseg0/arr-media-guard:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.version.outputs.tags }}
